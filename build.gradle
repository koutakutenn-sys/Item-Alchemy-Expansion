plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about declaring repositories.

	// Item Alchemy, MCPitanLib, Cloth Config and Mod Menu are consumed as plain jars.
	// Modrinth's Maven repository serves the exact builds published on its release pages.
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content { includeGroup "maven.modrinth" }
	}

	// Item Alchemy + mcpitanlib
	maven { url = "https://maven.pitan76.net/" }
	// architectury (transitive dep of mcpitanlib)
	maven { url = "https://maven.architectury.dev/" }
	// Cloth Config API
	maven { url = "https://maven.shedaniel.me/" }
	// Mod Menu
	maven { url = "https://maven.terraformersmc.com/releases/" }
	maven { url = "https://jitpack.io" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"itemalchemy-expansion" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'itemalchemy-expansion-port-tests'
		enableGameTests = false
		enableClientGameTests = true
		eula = false
		clearRunDirectory = false
	}
	configureDataGeneration {
		client = true
	}
}

// ---------------------------------------------------------------------------
// Third-party build dependencies
//
// Item Alchemy, MCPitanLib and the two optional config UIs come from Modrinth's
// Maven repository (see repositories above) and are consumed as plain jars, not
// as remapped mod dependencies like on the 1.20.1 branch. Item Alchemy is still
// the 1.20.1 build, so compilation uses an official-name view generated from it
// while the original jar stays on the runtime classpath.
// ---------------------------------------------------------------------------
configurations {
	itemAlchemy

	// Item Alchemy is only needed at runtime in its original form: compilation uses the
	// official-name view generated from it (see prepareItemAlchemyCompileView).
	runtimeOnly.extendsFrom itemAlchemy
}

// Official-name compile-only view of Item Alchemy, generated by the
// prepareItemAlchemyCompileView task below.
def nativeDevJar = layout.buildDirectory.file('itemalchemy-1.3.9-native-dev.jar')

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Item Alchemy (the mod this is an addon of) + its dependency mcpitanlib.
	// Item Alchemy is still the 1.20.1 build and is rewritten at runtime, so it is
	// compiled against a generated official-name view and kept unremapped at runtime.
	itemAlchemy "maven.modrinth:item-alchemy:${project.itemalchemy_version}"
	compileOnly files(nativeDevJar)
	implementation "maven.modrinth:mcpitanlibarch:${project.mcpitanlib_version}"

	// Optional config UI: Cloth Config API + Mod Menu (soft deps at runtime)
	implementation "maven.modrinth:cloth-config:${project.cloth_config_version}"
	implementation "maven.modrinth:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
	it.options.compilerArgs += ['-Xmaxerrs', '1000']
}

// The upstream dependency's bridge runs after Mixin, so its mixins must match
// intermediary descriptors at injection time. No game/dependency JAR is modified.
def bridgeExec = services.get(org.gradle.process.ExecOperations)
tasks.register('prepareItemAlchemyCompileView') {
	inputs.files(configurations.itemAlchemy, 'build-tools/runtime-class-map.tsv', 'build-tools/NativeDevJar.java')
	outputs.file(nativeDevJar)
	doLast {
		bridgeExec.exec {
			commandLine javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }.get().executablePath.asFile,
				'-cp', configurations.compileClasspath.asPath, file('build-tools/NativeDevJar.java'),
				file('build-tools/runtime-class-map.tsv'), configurations.itemAlchemy.singleFile, nativeDevJar.get().asFile
		}
	}
}
['compileJava', 'compileClientJava'].each { name ->
	tasks.named(name, JavaCompile).configure {
		dependsOn tasks.named('prepareItemAlchemyCompileView')
		inputs.files('build-tools/LegacyMixinBridge.java', 'build-tools/runtime-class-map.tsv')
		doLast {
			bridgeExec.exec {
				commandLine javaCompiler.get().metadata.installationPath.file('bin/java').asFile,
					'-cp', classpath.asPath, file('build-tools/LegacyMixinBridge.java'),
					file('build-tools/runtime-class-map.tsv'),
					destinationDirectory.dir('itemalchemy/expansion/mixin').get().asFile
			}
		}
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.register('portDataSmoke', JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'itemalchemy.expansion.PortDataSmokeTest'
	workingDir = layout.buildDirectory.dir('port-data-smoke').get().asFile
	doFirst { workingDir.mkdirs() }
}
// These regression assertions use a standalone Minecraft bootstrap, not JUnit.
tasks.named('test', Test) { failOnNoDiscoveredTests = false }
tasks.named('check') { dependsOn tasks.named('portDataSmoke') }

// Exercise the packaged mod, not development class directories, when requested.
if (providers.gradleProperty('portTestBuiltJar').isPresent()) {
	tasks.named('runClientGameTest', JavaExec).configure {
		dependsOn tasks.named('jar'), tasks.named('gametestClasses')
		def developmentOutputs = (sourceSets.main.output.files + sourceSets.client.output.files)
		def originalFiles = classpath.files
		classpath = files(originalFiles.findAll { !developmentOutputs.contains(it) }) + files(tasks.jar.archiveFile)
		systemProperty 'iaexp.test.packaged', 'true'
	}
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
